name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: tests + bundle (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Bundle emission (both faces) does not require DSH source declarations;
      # the full tsc typecheck runs in the dedicated job below.
      - run: pnpm run build:package
      - run: git diff --check

  typecheck:
    name: full typecheck (needs DSH source floor)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Standalone resolution typechecks against published npm packages.
      # Known limitation until upstream publishes the newer client-connection
      # surfaces (api.jobs / JobOutputView) that only exist in the DSH
      # monorepo today; the job is advisory rather than blocking.
      - run: pnpm exec tsc --noEmit -p tsconfig.json

  install-smoke:
    name: public install smoke (DSH 0.1.1-rc.2)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DSH_HOME: /tmp/dsh-goodjob-smoke
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install from public GitHub
        run: pnpm dlx @deepseek-ai/dsh@0.1.1-rc.2 plugin --profile web add github:fentz26/dsh-goodjob
      - name: Verify registration and shipped artifact
        run: |
          test -f "$DSH_HOME/profiles/web/node_modules/dsh-goodjob/cordis.patch.yml"
          test "$(node -p "require('$DSH_HOME/profiles/web/node_modules/dsh-goodjob/package.json').version")" = "2026.8.3"
          test ! -e "$DSH_HOME/profiles/web/node_modules/dsh-goodjob/src"
      - name: Boot web profile and fetch client bundle
        run: |
          pnpm dlx @deepseek-ai/dsh@0.1.1-rc.2 --profile web --no-open >"$RUNNER_TEMP/dsh-web.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent --output "$RUNNER_TEMP/goodjob-client.js" http://127.0.0.1:3080/plugins/dsh-goodjob/client.js; then
              test -s "$RUNNER_TEMP/goodjob-client.js"
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/dsh-web.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/dsh-web.log"
          exit 1
      - name: Remove cleanly
        run: |
          pnpm dlx @deepseek-ai/dsh@0.1.1-rc.2 plugin --profile web remove dsh-goodjob
          test ! -e "$DSH_HOME/profiles/web/node_modules/dsh-goodjob"
